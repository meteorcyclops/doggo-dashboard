<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>迷路了｜狗狗情報小屋</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #3d3366; background: linear-gradient(180deg, #78cfff, #fef6ff); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif; }
      main { width: min(100%, 620px); padding: 32px; text-align: center; background: #fffaf3; border: 4px solid #706bb6; box-shadow: inset 0 0 0 2px #fff, 0 8px 0 #8f8ac8; }
      .dog { margin: 0 auto 20px; width: 96px; height: 82px; display: grid; place-items: center; font-size: 54px; background: #ffbdd8; border: 4px solid #5d5aa2; }
      h1 { margin: 0; font-size: clamp(30px, 8vw, 52px); }
      p { margin: 16px 0 24px; font-size: 18px; line-height: 1.7; }
      a { display: inline-flex; min-height: 48px; align-items: center; padding: 10px 18px; color: #3d3366; font-weight: 700; text-decoration: none; background: #ffe67a; border: 3px solid #8d6a1c; box-shadow: 0 4px 0 #c9a54d; }
      a:focus-visible { outline: 3px solid #1f55c5; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div class="dog" aria-hidden="true">🐶</div>
      <h1>狗狗也找不到這一頁</h1>
      <p>這條路可能搬家了，先回情報小屋看看今天的重點吧。</p>
      <a href="/">回到狗狗情報小屋</a>
    </main>
  </body>
</html>
